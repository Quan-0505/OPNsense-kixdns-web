name: Build appdpi (FreeBSD, cross)

# Builds SuLingGG/panabit-appdpi for FreeBSD (OPNsense 26.7 = FreeBSD 15.1) on an
# Ubuntu runner, using the official FreeBSD base.txz as the cross sysroot.
#
# Why here: the kixdns package already needs a FreeBSD cross build, and the
# appdpi engine this page reads from has to match. Upstream ships OpenWrt SDK
# builds only, so a FreeBSD binary has to come from somewhere — this runner is
# that somewhere.
#
# The default ref is the last commit the upstream author vouched for; anything
# newer in that repo is unattended bot work and must not be built.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "panabit-appdpi commit/tag (default = last trusted commit 343e4a0)"
        required: false
        default: "343e4a03ce0b22fb9a8717291e27e01349269053"
      freebsd_release:
        description: "FreeBSD base.txz release used as sysroot"
        required: false
        default: "15.1-RELEASE"
      appdpi_version:
        description: "package version for the .pkg and the release tag"
        required: false
        default: "1.0.1"

permissions:
  contents: write

env:
  # owner/repo, not a URL: the upstream is private, so the source comes through
  # the tarball API with the APPDFI_TOKEN secret instead of a git clone.
  APPDFI_REPO: SuLingGG/panabit-appdpi

jobs:
  cross:
    name: Cross build appdpi (${{ inputs.freebsd_release }})
    runs-on: ubuntu-24.04
    steps:
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld xz-utils
          clang --version | head -2
          ld.lld --version

      - name: Cache FreeBSD sysroot
        id: sysroot-cache
        uses: actions/cache@v4
        with:
          path: /opt/fbsd
          key: fbsd-sysroot-${{ inputs.freebsd_release }}-v1

      - name: Fetch FreeBSD sysroot
        if: steps.sysroot-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          curl -fsSL -o /tmp/base.txz \
            "https://download.freebsd.org/releases/amd64/${{ inputs.freebsd_release }}/base.txz"
          sudo mkdir -p /opt/fbsd
          sudo tar -xJf /tmp/base.txz -C /opt/fbsd

      - name: Inspect sysroot
        run: |
          echo "--- what the base actually ships for pcap ---"
          ls -l /opt/fbsd/usr/include/pcap.h /opt/fbsd/usr/include/pcap/pcap.h 2>/dev/null || true
          ls -l /opt/fbsd/lib/libpcap* /opt/fbsd/usr/lib/libpcap* 2>/dev/null || true
          cat /opt/fbsd/bin/freebsd-version 2>/dev/null || true
          echo "--- libc for the linker ---"
          ls -l /opt/fbsd/lib/libc.so* /opt/fbsd/usr/lib/libc.a 2>/dev/null | head -4

      - name: Fetch appdpi source at the requested ref
        env:
          TOKEN: ${{ secrets.APPDFI_TOKEN }}
          REF: ${{ inputs.upstream_ref }}
        run: |
          set -eu
          # the upstream repo is private: a plain anonymous clone gets
          # "could not read Username for 'https://github.com'". The tarball API
          # with a token that has repo read works for any commit, and avoids
          # putting the token in a remote URL where it would land in the log.
          mkdir -p appdpi-src
          URL="https://api.github.com/repos/$APPDFI_REPO/tarball/$REF"
          if [ -n "${TOKEN:-}" ]; then
            curl -fsSL -H "Authorization: Bearer $TOKEN" -o /tmp/src.tgz "$URL"
          else
            curl -fsSL -o /tmp/src.tgz "$URL"
          fi
          tar -xzf /tmp/src.tgz -C appdpi-src --strip-components=1
          echo "--- source tree ---"
          ls appdpi-src | head -12
          echo "--- requested ref ---"
          echo "$REF"
          head -3 appdpi-src/CHANGELOG.md 2>/dev/null || true

      # Upstream pulls Linux-only interfaces in two places: the eBPF loader
      # (skipped below) and iface_mac(), which reads the NIC hardware address via
      # ioctl(SIOCGIFHWADDR) / ifr_hwaddr. FreeBSD exposes it through AF_LINK +
      # sockaddr_dl, so rewrite that one function behind __FreeBSD__ and add the
      # header it needs. The rewrite is expressed as a regex over the function
      # body so it keeps applying as surrounding lines move.
      - name: FreeBSD adaptation for the Linux-only MAC lookup
        run: |
          set -eu
          python3 - <<'PY'
          import re, pathlib, sys
          p = pathlib.Path('src/main.c')
          s = p.read_text()
          pat = re.compile(r'static int iface_mac\(const char \*name, uint8_t mac\[6\]\)\n\{.*?\n\}\n', re.S)
          m = pat.search(s)
          if not m:
              sys.exit('iface_mac() not found - upstream changed shape, patch needs updating')
          new = '''static int iface_mac(const char *name, uint8_t mac[6])
          {
          #ifdef __FreeBSD__
              struct ifaddrs *ifa = NULL, *p;
              int found = 0;
              if (getifaddrs(&ifa) != 0)
                  return 0;
              for (p = ifa; p; p = p->ifa_next) {
                  if (!p->ifa_addr || p->ifa_addr->sa_family != AF_LINK)
                      continue;
                  if (strcmp(p->ifa_name, name) != 0)
                      continue;
                  struct sockaddr_dl *sdl = (struct sockaddr_dl *)p->ifa_addr;
                  if (sdl->sdl_alen != 6)
                      continue;
                  memcpy(mac, LLADDR(sdl), 6);
                  found = 1;
                  break;
              }
              freeifaddrs(ifa);
              return found;
          #else
              int fd = socket(AF_INET, SOCK_DGRAM | SOCK_CLOEXEC, 0);
              struct ifreq ifr;
              if (fd < 0)
                  return 0;
              memset(&ifr, 0, sizeof(ifr));
              snprintf(ifr.ifr_name, sizeof(ifr.ifr_name), "%s", name);
              if (ioctl(fd, SIOCGIFHWADDR, &ifr) != 0) {
                  close(fd);
                  return 0;
              }
              close(fd);
              memcpy(mac, ifr.ifr_hwaddr.sa_data, 6);
              for (int i = 0; i < 6; i++)
                  if (mac[i])
                      return 1;
              return 0;
          #endif
          }
          '''
          s = s[:m.start()] + new + s[m.end():]
          p.write_text(s)
          print('iface_mac(): FreeBSD branch installed')
          PY
          # sockaddr_dl / LLADDR live in net/if_dl.h on FreeBSD
          sed -i.bak 's|^#include <net/if.h>$|#include <net/if.h>\n#ifdef __FreeBSD__\n#include <net/if_dl.h>\n#endif|' src/main.c || true
          grep -n 'net/if_dl.h' src/main.c || echo "(header not present in this ref, -include will cover it)"
      - name: Cross compile
        run: |
          set -eu
          SYSROOT=/opt/fbsd
          TARGET=x86_64-unknown-freebsd15
          cd appdpi-src

          # The base ships libpcap twice: the shared object tcpdump itself links,
          # and a static archive. The archive pulls in RDMA capture support and
          # therefore needs libibverbs/libirdma symbols at link time; the shared
          # object defers that to runtime and matches what the OS does. Prefer
          # the .so, keep the archive as a fallback with the extra libs.
          PCAP=""
          EXTRA=""
          PCAP_SO=$(ls "$SYSROOT"/usr/lib/libpcap.so.8 "$SYSROOT"/lib/libpcap.so.8 2>/dev/null | head -1 || true)
          if [ -n "$PCAP_SO" ]; then
            PCAP="$PCAP_SO"
            echo "linking dynamically against: $PCAP"
          else
            PCAP=$(ls "$SYSROOT"/usr/lib/libpcap.a "$SYSROOT"/lib/libpcap.a 2>/dev/null | head -1 || true)
            EXTRA="-libverbs -lirdma"
            echo "linking statically against: $PCAP (extra: $EXTRA)"
          fi
          if [ -z "$PCAP" ]; then
            echo "no libpcap in the base sysroot" >&2
            exit 1
          fi

          mkdir -p ../obj
          for f in src/*.c; do
            # bench_main.c is a benchmark harness with its own main(); upstream's
            # Makefile lists SRCS explicitly for the same reason
            case "$(basename "$f")" in
              bench_main.c) echo "  skip $(basename "$f")"; continue ;;
              # bpf_load.c is the eBPF classifier loader: <linux/bpf.h>,
              # syscall(__NR_bpf), sys/statfs.h. FreeBSD has no eBPF classifier
              # to load, so it cannot compile here; a stub satisfies exec.c.
              bpf_load.c) echo "  skip $(basename "$f") (linux-only eBPF)"; continue ;;
            esac
            echo "  cc $(basename "$f")"
            # Ten of the 26 sources use AF_INET / struct in6_addr / struct
            # sockaddr_in while only including <arpa/inet.h>, which pulls the
            # socket headers in on glibc but not on FreeBSD. Pre-including the
            # network headers is the least invasive way to cross-build the
            # upstream tree unmodified.
            clang --target=$TARGET --sysroot=$SYSROOT \
              -O2 -g -std=c11 -Wall -Wextra \
              -include sys/types.h -include sys/socket.h \
              -include netinet/in.h -include arpa/inet.h \
              -Isrc -I"$SYSROOT/usr/include" \
              -c "$f" -o "../obj/$(basename "$f" .c).o"
          done

          # FreeBSD stub for the Linux-only eBPF loader
          cat > bpf_load_stub.c <<'STUB'
          #include <stddef.h>
          #include "bpf_load.h"
          int bpf_load(const char *obj, char *err, size_t cap)
          { (void)obj; (void)err; (void)cap; return -1; }
          int bpf_load_if_needed(const char *obj, char *err, size_t cap)
          { (void)obj; (void)err; (void)cap; return -1; }
          STUB
          clang --target=$TARGET --sysroot=$SYSROOT -I../src -c bpf_load_stub.c -o ../obj/zz_bpf_stub.o
          clang --target=$TARGET --sysroot=$SYSROOT -fuse-ld=lld \
            -o appdpi ../obj/*.o "$PCAP" $EXTRA

          echo "--- artifact sanity ---"
          file appdpi
          readelf -h appdpi | grep -E 'Class|Machine|OS/ABI'
          echo "--- dynamic deps (must resolve inside a FreeBSD 15 userland) ---"
          readelf -d appdpi | grep -E 'NEEDED|RPATH|RUNPATH' || echo "(static)"

      - name: Record checksums and build metadata
        run: |
          set -eu
          cd appdpi-src
          sha256sum appdpi | tee ../appdpi.sha256
          {
            echo "upstream_ref=${{ inputs.upstream_ref }}"
            echo "freebsd_sysroot=${{ inputs.freebsd_release }}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "compiler=$(clang --version | head -1)"
            echo "--- file ---"
            file appdpi
            echo "--- size ---"
            ls -l appdpi
          } > ../appdpi.build.txt
          cat ../appdpi.build.txt

      - uses: actions/upload-artifact@v4
        with:
          name: appdpi-freebsd-amd64
          path: |
            appdpi-src/appdpi
            appdpi.sha256
            appdpi.build.txt
          if-no-files-found: error

  package:
    name: Package appdpi-${{ inputs.appdpi_version }} (FreeBSD:15:amd64)
    needs: cross
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appdpi-freebsd-amd64
          path: dist

      - name: Stage package root
        run: |
          set -eu
          # The installed appdpi-1.0.0 package owns exactly one path, so the
          # replacement has to own exactly the same one -- anything more would
          # make "pkg add -f" delete files that belong to os-appdpi-devel
          # (the rulepack, the rc script, the UI).
          rm -rf stage
          mkdir -p stage/usr/local/bin
          install -m 0755 dist/appdpi-src/appdpi stage/usr/local/bin/appdpi
          file stage/usr/local/bin/appdpi
          sha256sum stage/usr/local/bin/appdpi

      - name: Build +MANIFEST and .pkg
        env:
          VERSION: ${{ inputs.appdpi_version }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
          SYSROOT_REL: ${{ inputs.freebsd_release }}
        run: |
          set -eu
          python3 - <<'PY'
          import hashlib, json, os

          root = "stage"
          files, flatsize = {}, 0
          for base, _dirs, names in os.walk(root):
              for name in names:
                  path = os.path.join(base, name)
                  rel = "/" + os.path.relpath(path, root).replace(os.sep, "/")
                  data = open(path, "rb").read()
                  flatsize += len(data)
                  files[rel] = "1$" + hashlib.sha256(data).hexdigest()

          version = os.environ["VERSION"]
          manifest = {
              "name": "appdpi",
              "version": version,
              "origin": "net/appdpi",
              "comment": "设备级应用识别引擎（appdpi capture）",
              "maintainer": "Quan-0505@users.noreply.github.com",
              "www": "https://github.com/SuLingGG/panabit-appdpi",
              "abi": "FreeBSD:15:amd64",
              "arch": "freebsd:15:x86:64",
              "prefix": "/usr/local",
              "flatsize": flatsize,
              "licenselogic": "single",
              "licenses": ["MIT"],
              "desc": (
                  "Device-level application identification engine (appdpi capture).\n"
                  "Built from SuLingGG/panabit-appdpi at " + os.environ["UPSTREAM_REF"] + ",\n"
                  "cross-compiled against the FreeBSD " + os.environ["SYSROOT_REL"] + " base sysroot.\n\n"
                  "WWW: https://github.com/SuLingGG/panabit-appdpi"
              ),
              "categories": ["net"],
              "annotations": {
                  "upstream_ref": os.environ["UPSTREAM_REF"],
                  "freebsd_sysroot": os.environ["SYSROOT_REL"],
                  "built_by": "Quan-0505/OPNsense-kixdns-web build-appdpi.yml",
              },
          }
          compact = dict(manifest)
          manifest["files"] = files
          with open("+COMPACT_MANIFEST", "w") as fh:
              json.dump(compact, fh, separators=(",", ":"))
          with open("+MANIFEST", "w") as fh:
              json.dump(manifest, fh, separators=(",", ":"))
          print("files:", list(files), "flatsize:", flatsize)
          PY

          OUT="appdpi-${VERSION}-FreeBSD_15_amd64.pkg"
          ( echo "+COMPACT_MANIFEST"
            echo "+MANIFEST"
            cd stage && find . -type f | sed 's|^\./|stage/|' | sort ) > filelist.txt
          tar --owner=0 --group=0 --numeric-owner \
              --transform='s|^stage/|/|' \
              -Jcf "${OUT}" -T filelist.txt
          ls -lh "${OUT}"
          echo "--- archive head ---"
          tar -tf "${OUT}" | head -n 5
          sha256sum "${OUT}" | tee "${OUT}.sha256"
          echo "PKG_FILE=${OUT}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_FILE }}
          path: |
            ${{ env.PKG_FILE }}
            ${{ env.PKG_FILE }}.sha256

      # pkg add https://github.com/Quan-0505/OPNsense-kixdns-web/releases/download/appdpi-<v>/<file>.pkg
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: appdpi-${{ inputs.appdpi_version }}
          target_commitish: main
          name: appdpi ${{ inputs.appdpi_version }} (FreeBSD 15.1 amd64)
          body: |
            Device-level app identification engine for OPNsense 26.7, cross-built
            from `SuLingGG/panabit-appdpi` @ `${{ inputs.upstream_ref }}`.

            Contains only `/usr/local/bin/appdpi` — it replaces the binary from
            `appdpi-1.0.0` and leaves `os-appdpi-devel` (rulepack, rc script, UI)
            untouched.

            **What this build fixes:** server-side TLS fingerprints (JA3S) no longer
            decide an application on their own. Before this, every site behind the
            same nginx TLS stack was attributed to the proxy app whose fingerprint
            matched (observed here: `github.com` → Aladdin云, plus a 赔钱机场/VPN
            cluster that should not exist on a home LAN).

            Install / upgrade:
            ```sh
            pkg add -f https://github.com/Quan-0505/OPNsense-kixdns-web/releases/download/appdpi-${{ inputs.appdpi_version }}/appdpi-${{ inputs.appdpi_version }}-FreeBSD_15_amd64.pkg
            /usr/local/etc/rc.d/appdpi restart
            ```
          files: |
            ${{ env.PKG_FILE }}
            ${{ env.PKG_FILE }}.sha256
          fail_on_unmatched_files: true

