[start]
command:/usr/local/etc/rc.d/kixdns start
parameters:
type:script
message:starting kixdns service
description:KixDNS service

[stop]
command:/usr/local/etc/rc.d/kixdns stop
parameters:
type:script
errors:no
message:stopping kixdns service
description:KixDNS service

[restart]
command:/usr/local/etc/rc.d/kixdns restart
parameters:
type:script
message:restarting kixdns service
description:KixDNS service

[reload]
command:/usr/local/etc/rc.d/kixdns restart
parameters:
type:script
message:reloading kixdns configuration
description:KixDNS service reload

# "status" must not fail hard: rc.subr exits 1 when the daemon is stopped and
# configd would turn that into "Execute error", which breaks the service widget.
[status]
command:/usr/local/etc/rc.d/kixdns status
parameters:
type:script_output
errors:no
message:requesting kixdns status
description:KixDNS service status

# diagnostics helper: proves the shipped binary runs on this machine at all
[version]
command:/usr/local/bin/kixdns --version 2>&1
parameters:
type:script_output
errors:no
message:requesting kixdns version
description:KixDNS binary version
