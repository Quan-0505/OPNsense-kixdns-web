# logfilename                                  [owner:group]  mode  count  size  when   flags  [/pid_file]              [sig_num]
# KixDNS logs are written by syslog-ng into /var/log/kixdns/ (see
# OPNsense/Syslog/local/kixdns.conf). Rotate daily at 00:00, keep 7
# compressed copies and ask syslog-ng to reopen its files.
/var/log/kixdns/kixdns_*.log    root:wheel     644    7      *     @T00   GZB    /var/run/syslog-ng.pid
