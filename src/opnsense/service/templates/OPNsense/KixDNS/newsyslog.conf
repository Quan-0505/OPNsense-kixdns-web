# logfilename                                  [owner:group]  mode  count  size  when   flags  [/pid_file]              [sig_num]
# KixDNS logs are written by syslog-ng into /var/log/kixdns/ (see
# OPNsense/Syslog/local/kixdns.conf). Rotate daily at 00:00, also rotate early
# once a file passes 200 MB, keep 3 compressed copies and ask syslog-ng to
# reopen its files.
#
# The size cap matters because enabling Debug (kixdns >= 0.2.0 native observer)
# makes kixdns emit a structured event per query stage - on a busy gateway that
# is easily 100-250 MB per day. With the cap below the whole set stays under
# ~600 MB while still holding a few days of history.
/var/log/kixdns/kixdns_*.log    root:wheel     644    3      200M  @T00   GZB    /var/run/syslog-ng.pid
