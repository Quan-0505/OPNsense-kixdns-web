###################################################################
# Local syslog-ng configuration filter definition [kixdns].
#
# The rc script starts kixdns through daemon(8) with "-T kixdns",
# so everything the process writes to stdout/stderr shows up as
# program "kixdns" and lands in /var/log/kixdns/kixdns_<date>.log,
# readable from the GUI: Services - KixDNS - Log File.
###################################################################
filter f_local_kixdns {
    program("kixdns");
};
